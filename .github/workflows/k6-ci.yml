name: k6 pre-release load test

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
      - uses: grafana/run-k6-action@4082a08c7e40cf6d65863911077dfb60ae0a4f04 # v1
        with:
          path: |
            06.test-suite-and-ci-integration/answer/tests/standard-load-test.js
            06.test-suite-and-ci-integration/answer/tests/peak-traffic-test.js
          parallel: true
          flags: -e BASE_URL=https://quickpizza.grafana.com
